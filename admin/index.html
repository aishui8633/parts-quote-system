<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <title>山河配件报价系统 - 后台管理</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="topbar">
    <h1>山河配件报价系统后台</h1>
    <nav class="topbar-nav">
      <button class="nav-btn active" data-page="parts">配件管理</button>
      <button class="nav-btn" data-page="log">操作日志</button>
      <button class="nav-btn" data-page="visit">访问统计</button>
    </nav>
    <div>
      <a href="/">返回查询页面</a>
      <button class="logout" id="logoutButton" type="button">退出后台</button>
    </div>
  </header>

  <section class="panel login-screen">
    <h2>后台访问密码</h2>
    <form id="loginForm">
      <label for="adminPassword">密码</label>
      <input id="adminPassword" name="password" type="password" autocomplete="current-password" required>
      <button id="loginButton" type="submit">进入后台</button>
      <div id="loginMessage" class="message"></div>
    </form>
  </section>

  <main id="page-parts">
    <section class="panel">
      <h2 id="formTitle">新增零件</h2>
      <div id="editBanner" class="edit-mode-banner">
        正在编辑 #<span id="editId"></span> - <span id="editName"></span>
      </div>
      <form id="partForm">
        <label for="partName">零件名称</label>
        <input id="partName" name="partName" autocomplete="off" required>

        <label for="specification">规格型号</label>
        <input id="specification" name="specification" autocomplete="off" required>

        <label for="marketPrice">价格</label>
        <input id="marketPrice" name="marketPrice" type="number" min="0" step="1" required>

        <div class="form-grid">
          <div>
            <label for="brand">品牌</label>
            <input id="brand" name="brand" value="山河智能">
          </div>
          <div>
            <label for="unit">单位</label>
            <input id="unit" name="unit" value="PCS">
          </div>
        </div>

        <button id="submitButton" type="submit">保存到数据库</button>
        <button id="cancelEditButton" type="button" class="btn-cancel" style="display:none;">取消编辑</button>
        <div id="message" class="message"></div>
      </form>
    </section>

    <section class="panel">
      <div class="stats">
        <div class="stat">
          <strong id="partCount">0</strong>
          <span>当前零件总数</span>
        </div>
        <div class="stat">
          <strong id="filteredCount">0</strong>
          <span>搜索结果</span>
        </div>
        <div class="stat">
          <strong id="currentPage">1</strong>
          <span>当前页</span>
        </div>
      </div>

      <div class="export-actions">
        <a id="exportJson" href="#" download>导出 JSON 备份</a>
        <a id="exportCsv" href="#" download>导出 CSV 表格</a>
        <a id="importBtn" href="#" class="btn-import">导入 Excel</a>
      </div>

      <!-- 导入模态框 -->
      <div id="importModal" class="modal hidden">
        <div class="modal-content">
          <div class="modal-header">
            <h3>导入配件数据</h3>
            <button class="modal-close" id="importModalClose">&times;</button>
          </div>
          <div class="modal-body">
            <div id="importStep1">
              <p>请选择 Excel 文件（.xlsx 或 .xls）</p>
              <p class="import-hint">格式要求：零件名称、规格型号、价格（3列）</p>
              <input type="file" id="fileInput" accept=".xlsx,.xls">
            </div>
            <div id="importStep2" class="hidden">
              <div id="importResult"></div>
              <div id="importPreview" class="hidden">
                <h4>预览（前10条）</h4>
                <div class="preview-table-wrapper">
                  <table class="preview-table">
                    <thead>
                      <tr>
                        <th>零件名称</th>
                        <th>规格型号</th>
                        <th>价格</th>
                      </tr>
                    </thead>
                    <tbody id="previewBody"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button id="importCancelBtn" class="btn-cancel">取消</button>
            <button id="importConfirmBtn" class="btn-confirm hidden" disabled>确认导入</button>
          </div>
        </div>
      </div>

      <div class="search-box">
        <input id="searchInput" type="text" placeholder="搜索零件名称或规格型号...">
        <button class="search-clear" id="searchClear" style="display:none;">×</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>编号</th>
            <th>零件名称</th>
            <th>规格型号</th>
            <th>价格</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="partsList"></tbody>
      </table>

      <div class="pagination" id="pagination"></div>
    </section>
  </main>

  <main id="page-log" class="hidden">
    <section class="panel log-panel">
      <h2>操作日志</h2>
      <div class="log-filter">
        <select id="logTypeFilter">
          <option value="">全部类型</option>
          <option value="新增">新增</option>
          <option value="编辑">编辑</option>
          <option value="删除">删除</option>
        </select>
      </div>
      <table class="log-table">
        <thead>
          <tr>
            <th>时间</th>
            <th>类型</th>
            <th>配件ID</th>
            <th>配件名称</th>
            <th>变更详情</th>
          </tr>
        </thead>
        <tbody id="logList"></tbody>
      </table>
    </section>
  </main>

  <main id="page-visit" class="hidden">
    <section class="panel visit-panel">
      <h2>访问统计</h2>
      <div class="visit-stats">
        <div class="stat-card">
          <div class="stat-label">总访问量</div>
          <div class="stat-value" id="totalVisits">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">今日访问</div>
          <div class="stat-value" id="todayVisits">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">独立访客</div>
          <div class="stat-value" id="uniqueIPs">0</div>
        </div>
      </div>
      <h3>最近7天访问趋势</h3>
      <div class="visit-chart" id="visitChart"></div>
      <h3>访问记录</h3>
      <table class="log-table">
        <thead>
          <tr>
            <th>访问时间</th>
            <th>IP地址</th>
            <th>浏览器信息</th>
          </tr>
        </thead>
        <tbody id="visitList"></tbody>
      </table>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/search.js"></script>
  <script src="js/table.js"></script>
  <script src="js/form.js"></script>
  <script src="js/log.js"></script>
  <script src="js/visit.js"></script>
  <script src="js/import.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
