<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <title>山河配件报价系统 - 后台录入</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      color: #1f2933;
      background: #f4f7f6;
    }

    .topbar {
      background: #008d84;
      color: #fff;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .topbar a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 6px;
      padding: 8px 12px;
    }

    main {
      width: min(1080px, calc(100% - 32px));
      margin: 24px auto;
      display: grid;
      grid-template-columns: minmax(320px, 420px) 1fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: #fff;
      border: 1px solid #dde5e2;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
    }

    .panel h2 {
      margin: 0 0 16px;
      font-size: 18px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 700;
      font-size: 14px;
    }

    input {
      width: 100%;
      height: 42px;
      border: 1px solid #c8d4d1;
      border-radius: 6px;
      padding: 0 12px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      border-color: #008d84;
      box-shadow: 0 0 0 3px rgba(0, 141, 132, 0.14);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 12px;
    }

    button {
      width: 100%;
      height: 44px;
      margin-top: 18px;
      border: 0;
      border-radius: 6px;
      background: #008d84;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .message {
      min-height: 22px;
      margin-top: 12px;
      font-size: 14px;
      color: #0f766e;
    }

    .message.error {
      color: #b42318;
    }

    .export-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .export-actions a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border: 1px solid #008d84;
      border-radius: 6px;
      color: #00756e;
      background: #eefaf8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat {
      flex: 1;
      border: 1px solid #dde5e2;
      border-radius: 8px;
      padding: 12px;
      background: #fafcfb;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      color: #008d84;
    }

    .stat span {
      font-size: 13px;
      color: #64748b;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid #e5ece9;
      vertical-align: top;
    }

    th {
      color: #475569;
      font-size: 13px;
      background: #f8faf9;
    }

    .price {
      color: #b45309;
      font-weight: 700;
      white-space: nowrap;
    }

    .login-screen {
      width: min(420px, calc(100% - 32px));
      margin: 60px auto;
    }

    body.locked main {
      display: none;
    }

    body.unlocked .login-screen {
      display: none;
    }

    .topbar .logout {
      width: auto;
      height: auto;
      margin: 0;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: transparent;
      font-size: 14px;
    }

    body.locked .logout {
      display: none;
    }

    @media (max-width: 820px) {
      main {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>山河配件报价系统后台</h1>
    <div>
      <a href="/">返回查询页面</a>
      <button class="logout" id="logoutButton" type="button">退出后台</button>
    </div>
  </header>

  <section class="panel login-screen">
    <h2>后台访问密码</h2>
    <form id="loginForm">
      <label for="adminPassword">密码</label>
      <input id="adminPassword" name="password" type="password" autocomplete="current-password" required>
      <button id="loginButton" type="submit">进入后台</button>
      <div id="loginMessage" class="message"></div>
    </form>
  </section>

  <main>
    <section class="panel">
      <h2>新增或更新零件</h2>
      <form id="partForm">
        <label for="partName">零件名称</label>
        <input id="partName" name="partName" autocomplete="off" required>

        <label for="specification">规格型号</label>
        <input id="specification" name="specification" autocomplete="off" required>

        <label for="marketPrice">价格</label>
        <input id="marketPrice" name="marketPrice" type="number" min="0" step="1" required>

        <div class="form-grid">
          <div>
            <label for="brand">品牌</label>
            <input id="brand" name="brand" value="山河智能">
          </div>
          <div>
            <label for="unit">单位</label>
            <input id="unit" name="unit" value="PCS">
          </div>
        </div>

        <button id="submitButton" type="submit">保存到数据库</button>
        <div id="message" class="message"></div>
      </form>
    </section>

    <section class="panel">
      <div class="stats">
        <div class="stat">
          <strong id="partCount">0</strong>
          <span>当前零件总数</span>
        </div>
        <div class="stat">
          <strong id="latestId">-</strong>
          <span>最新编号</span>
        </div>
      </div>

      <div class="export-actions">
        <a id="exportJson" href="#" download>导出 JSON 备份</a>
        <a id="exportCsv" href="#" download>导出 CSV 表格</a>
      </div>

      <h2>最近记录</h2>
      <table>
        <thead>
          <tr>
            <th>零件名称</th>
            <th>规格型号</th>
            <th>价格</th>
          </tr>
        </thead>
        <tbody id="recentParts"></tbody>
      </table>
    </section>
  </main>

  <script>
    const TOKEN_KEY = 'partsQuoteAdminToken';
    const form = document.getElementById('partForm');
    const loginForm = document.getElementById('loginForm');
    const message = document.getElementById('message');
    const loginMessage = document.getElementById('loginMessage');
    const submitButton = document.getElementById('submitButton');
    const loginButton = document.getElementById('loginButton');
    const logoutButton = document.getElementById('logoutButton');
    const exportJson = document.getElementById('exportJson');
    const exportCsv = document.getElementById('exportCsv');
    const recentParts = document.getElementById('recentParts');
    const partCount = document.getElementById('partCount');
    const latestId = document.getElementById('latestId');

    document.body.classList.add('locked');

    function getToken() {
      return localStorage.getItem(TOKEN_KEY) || '';
    }

    function setAuthState(isAuthenticated) {
      document.body.classList.toggle('locked', !isAuthenticated);
      document.body.classList.toggle('unlocked', isAuthenticated);

      if (isAuthenticated) {
        const token = encodeURIComponent(getToken());
        exportJson.href = `/api/parts/export.json?token=${token}`;
        exportCsv.href = `/api/parts/export.csv?token=${token}`;
      }
    }

    function setMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle('error', isError);
    }

    function setLoginMessage(text, isError = false) {
      loginMessage.textContent = text;
      loginMessage.classList.toggle('error', isError);
    }

    function formatPrice(price) {
      return `¥${Math.floor(Number(price) || 0).toFixed(2)}`;
    }

    async function loadParts() {
      const response = await fetch('/api/parts');
      const parts = await response.json();
      const latest = parts.slice(-8).reverse();

      partCount.textContent = parts.length;
      latestId.textContent = parts.length ? Math.max(...parts.map((part) => Number(part.id) || 0)) : '-';
      recentParts.innerHTML = latest.map((part) => `
        <tr>
          <td>${part.partName || ''}</td>
          <td>${part.specification || ''}</td>
          <td class="price">${formatPrice(part.marketPrice)}</td>
        </tr>
      `).join('');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submitButton.disabled = true;
      setMessage('正在保存...');

      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());

      try {
        const response = await fetch('/api/parts', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${getToken()}`
          },
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || '保存失败');
        }

        setMessage(result.updatedExisting ? '已更新已有零件信息。' : '已新增零件并写入数据库。');
        form.partName.value = '';
        form.specification.value = '';
        form.marketPrice.value = '';
        form.partName.focus();
        await loadParts();
      } catch (err) {
        setMessage(err.message, true);
      } finally {
        submitButton.disabled = false;
      }
    });

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginButton.disabled = true;
      setLoginMessage('正在验证...');

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: loginForm.password.value })
        });
        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || '密码错误');
        }

        localStorage.setItem(TOKEN_KEY, result.token);
        loginForm.password.value = '';
        setAuthState(true);
        setLoginMessage('');
        await loadParts();
      } catch (err) {
        setLoginMessage(err.message, true);
      } finally {
        loginButton.disabled = false;
      }
    });

    logoutButton.addEventListener('click', () => {
      localStorage.removeItem(TOKEN_KEY);
      setAuthState(false);
      setMessage('');
      setLoginMessage('');
      loginForm.password.focus();
    });

    if (getToken()) {
      setAuthState(true);
      loadParts().catch((err) => {
        localStorage.removeItem(TOKEN_KEY);
        setAuthState(false);
        setLoginMessage(`请重新登录：${err.message}`, true);
      });
    } else {
      setAuthState(false);
      loginForm.password.focus();
    }
  </script>
</body>
</html>
