services:
  parts-quote:
    image: aishui8633/parts-quote-system:main
    container_name: sunward-parts-quote
    ports:
      - "8373:3000"
    volumes:
      # 数据持久化 - 价格数据
      - /vol1/1000/docker/parts-quote-system/data:/app/data
      # 开发调试 - admin 目录挂载
      - /vol1/1000/docker/parts-quote-system/admin:/app/admin
    restart: always
    environment:
      - NODE_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    networks:
      - bridge